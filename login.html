<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Customer Login | ATP Business Portal

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body class="bg-light">

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="card shadow">

<div class="card-body p-5">

<div class="text-center mb-4">

    <img

    class="site-logo"
    
    src="images/logo.png"
    
    height="60">

<h2 class="mt-3">

Customer Login

</h2>

<p>

Sign in to your ATP Business Portal account

</p>

</div>

<form id="loginForm">
    <div class="mb-3">

        <label>
        
        Email Address
        
        </label>
        
        <input
        type="email"
        id="email"
        class="form-control"
        required>
        
        </div>
        
        <div class="mb-3">
        
        <label>
        
        Password
        
        </label>
        
        <input
        type="password"
        id="password"
        class="form-control"
        required>
        
        </div>
        
        <div
        id="loginMessage"
        class="alert d-none">
        
        </div>
        
        <div
        id="loadingLogin"
        class="text-center d-none">
        
        <div class="spinner-border text-danger"></div>
        
        <p class="mt-2">
        
        Signing In...
        
        </p>
        
        </div>
        
        <button
        type="submit"
        class="btn btn-danger w-100">
        
        Login
        
        </button>
        <div class="text-center mt-4">

            <a
            href="#"
            id="forgotPassword">
            
            Forgot Password?
            
            </a>
            
            <br><br>
            
            Don't have an account?
            
            <a
            href="register.html">
            
            Register
            
            </a>
            
            </div>
            
            </form>
            
            </div>
            
            </div>
            
            </div>
            
            </div>
            
            </div>
            
            </section>
            
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            
            <script src="js/supabase.js"></script>

            <script src="js/settings.js"></script>

            <script>

            loadWebsiteSettings();

            </script>
            
            <script src="js/login.js"></script>
            
            </body>
            
            </html>
