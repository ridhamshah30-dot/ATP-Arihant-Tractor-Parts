<!--=========================
PRODUCT DETAILS
==========================-->

<section class="py-5">

    <div class="container">
    
    <div class="row g-5">
    
    <!-- IMAGE -->
    
    <div class="col-lg-6">
    
    <div class="card shadow border-0">
    
    <div class="card-body text-center">
    
    <img
    id="mainImage"
    src="images/placeholder-product.png"
    class="img-fluid"
    style="max-height:450px;object-fit:contain;">
    
    </div>
    
    <div
    id="galleryImages"
    class="row g-3 mt-3">
    
    </div>
    

    </div>
    
    </div>
    
    <!-- DETAILS -->
    
    <div class="col-lg-6">
    
    <span
    id="stockStatus"
    class="badge bg-success">
    
    Loading...
    
    </span>
    
    <h2
    id="productName"
    class="mt-3">
    
    Loading...
    
    </h2>
    
    <h3 class="text-danger">
    
    ₹<span id="sellingPrice">0</span>
    
    <del class="text-secondary fs-5">
    
    ₹<span id="mrp">0</span>
    
    </del>
    
    </h3>
    
    <p
    id="description">
    
    Loading...
    
    </p>
   
    <div class="product-features mt-5">

        <h3>
    
            Key Features
    
        </h3>
    
        <ul id="productFeatures">
    
        </ul>
    
    
</div>

<hr>
    
    <table class="table">
    
    <tr>
    
    <th>Brand</th>
    
    <td id="brand">-</td>
    
    </tr>
    
    <tr>
    
    <th>Category</th>
    
    <td id="category">-</td>
    
    </tr>
    
    <tr>
    
    <th>Viscosity</th>
    
    <td id="viscosity">-</td>
    
    </tr>
    
    <tr>
    
    <th>Pack Size</th>
    
    <td id="packSize">-</td>
    
    </tr>
    
    </table>
    
    <div class="d-grid gap-3">
    
        <button
        id="enquiryButton"
        class="btn btn-danger btn-lg">
        
        Send Enquiry
        
        </button>
        
        <div
        id="enquiryMessage"
        class="alert d-none mt-3">
        
        </div>
    
        <a
        id="whatsappButton"
        href="#"
        target="_blank"
        class="btn btn-success btn-lg text-white">
        
        <span class="material-icons-round me-2">
        
        chat
        
        </span>
        
        WhatsApp
        
        </a>
    
    </div>
    
    </div>
    
    </div>
    
    </div>
    
    </section>

    <div
    class="row g-4"

    <div class="col-12 text-center">
    
    <div class="spinner-border text-danger"></div>
    
    <p class="mt-3">
    
    Loading Products...
    
    </p>
    
    </div>
    
    </div>
    
    </div>
    
    </section>
