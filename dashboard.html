<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>

Customer Dashboard

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

<div class="container">

<a
class="navbar-brand fw-bold"
href="index.html">

ATP Business Portal

</a>

<button
id="logoutBtn"
class="btn btn-light">

Logout

</button>

</div>

</nav>

<section class="py-5">

<div class="container">

<div class="row">

<div class="col-lg-3">

<div class="card shadow-sm">

<div class="card-body">

<h5>

My Account

</h5>

<div class="list-group">

<button
class="list-group-item list-group-item-action active"
data-page="profile">

Profile

</button>

<button
class="list-group-item list-group-item-action"
data-page="enquiries">

My Enquiries

</button>

<button
class="list-group-item list-group-item-action"
data-page="settings">

Settings

</button>

</div>

</div>

</div>

</div>
<div class="col-lg-9">

    <div
    id="profilePage"
    class="card shadow-sm">
    
    <div class="card-body">
    
    <h3>
    
    Profile
    
    </h3>
    
    <hr>
    
    <div class="row">
    
    <div class="col-md-6 mb-3">
    
    <label>
    
    Full Name
    
    </label>
    
    <input
    id="profileName"
    class="form-control"
    readonly>
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>
    
    Business
    
    </label>
    
    <input
    id="profileBusiness"
    class="form-control"
    readonly>
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>
    
    Mobile
    
    </label>
    
    <input
    id="profileMobile"
    class="form-control"
    readonly>
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>
    
    Email
    
    </label>
    
    <input
    id="profileEmail"
    class="form-control"
    readonly>
    
    </div>
    
    </div>
    
    </div>
    
    </div>
    <div
id="enquiryPage"
class="card shadow-sm mt-4 d-none">

<div class="card-body">

<h3>

My Enquiries

</h3>

<hr>

<table class="table">

<thead>

<tr>

<th>

Date

</th>

<th>

Product

</th>

<th>

Status

</th>

</tr>

</thead>

<tbody id="customerEnquiries">

<tr>

<td colspan="3">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/dashboard.js"></script>

</body>

</html>
